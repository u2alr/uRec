name: Probe Windows capabilities

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml", "ci/probe.ps1"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: pwsh
        run: ./ci/probe.ps1 *>&1 | Tee-Object -FilePath report.txt
      - name: Publish results
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/publish-results.ps1 -Name probe -File report.txt
