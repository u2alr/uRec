name: Probe Windows capabilities

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml", "ci/probe.ps1", "ci/ffmpeg-help.ps1", "ci/crate-versions.ps1"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: pwsh
        run: ./ci/probe.ps1 *>&1 | Tee-Object -FilePath report.txt
      - name: Publish results
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/publish-results.ps1 -Name probe -File report.txt
      - name: FFmpeg option help
        if: always()
        shell: pwsh
        run: ./ci/ffmpeg-help.ps1 *>&1 | Tee-Object -FilePath help.txt
      - name: Publish help
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/publish-results.ps1 -Name ffmpeg-help -File help.txt
      - name: Crate versions
        if: always()
        shell: pwsh
        run: ./ci/crate-versions.ps1 *>&1 | Tee-Object -FilePath crates.txt
      - name: Publish crate versions
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/publish-results.ps1 -Name crates -File crates.txt
