name: Probe Windows capabilities

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: System
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, VideoModeDescription | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores | Format-List
          "Session: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId)  Interactive: $([Environment]::UserInteractive)"
          rustc --version; cargo --version; rustup show
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table -AutoSize

      - name: Get FFmpeg
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $u = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.0-latest-win64-gpl-8.0.zip"
          Invoke-WebRequest $u -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $exe = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          "FF=$exe" | Out-File -Append $env:GITHUB_ENV
          & $exe -hide_banner -version | Select-Object -First 1

      - name: Filters and encoders present
        shell: pwsh
        run: |
          & $env:FF -hide_banner -filters 2>$null | Select-String "gfxcapture|ddagrab|hwdownload|scale_d3d11"
          & $env:FF -hide_banner -encoders 2>$null | Select-String "264|265|hevc|av1"

      - name: Try encoders (test encode)
        shell: pwsh
        run: |
          foreach ($e in "h264_nvenc","h264_amf","h264_qsv","h264_mf","libx264","libopenh264","hevc_nvenc","hevc_amf","av1_amf","libsvtav1") {
            $o = & $env:FF -hide_banner -loglevel error -f lavfi -i color=black:s=1280x720:r=30 -frames:v 10 -pix_fmt yuv420p -c:v $e -f null - 2>&1
            "{0,-12} exit={1} {2}" -f $e, $LASTEXITCODE, (($o | Select-Object -First 1) -as [string])
          }

      - name: Try capture methods (3 s each)
        shell: pwsh
        run: |
          $tests = [ordered]@{
            "gfxcapture-monitor" = @("-f","lavfi","-i","gfxcapture=monitor_idx=0:max_framerate=30,hwdownload,format=bgra");
            "ddagrab"            = @("-f","lavfi","-i","ddagrab=output_idx=0:framerate=30,hwdownload,format=bgra");
            "gdigrab"            = @("-f","gdigrab","-framerate","30","-i","desktop")
          }
          foreach ($k in $tests.Keys) {
            $out = "cap_$k.mp4"
            $log = & $env:FF -hide_banner -loglevel warning -y @($tests[$k]) -t 3 -c:v libx264 -preset ultrafast -pix_fmt yuv420p $out 2>&1
            $info = if (Test-Path $out) { & ($env:FF -replace 'ffmpeg.exe','ffprobe.exe') -v error -count_frames -select_streams v:0 -show_entries stream=width,height,nb_read_frames -of csv=p=0 $out } else { "no file" }
            "{0,-20} exit={1} -> {2}" -f $k, $LASTEXITCODE, $info
            $log | Select-Object -First 4 | ForEach-Object { "    $_" }
          }

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-captures
          path: "*.mp4"
          if-no-files-found: ignore
