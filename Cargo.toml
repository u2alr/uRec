[workspace]
resolver = "2"
members = ["crates/engine", "crates/win", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/u2alr/uRec"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
