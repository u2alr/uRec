[package]
name = "urec"
description = "uRec: lightweight screen and game recorder for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
build = "build.rs"

[[bin]]
name = "uRec"
path = "src/main.rs"

[dependencies]
urec-engine = { path = "../engine" }
urec-win = { path = "../win" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "glow", "default_fonts"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"
